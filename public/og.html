<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Undertow — share card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    overflow: hidden;
    background: #04070d;
  }
  #card {
    position: relative;
    width: 1200px; height: 630px;
    overflow: hidden;
    background:
      radial-gradient(1000px 700px at 50% 118%, #0a2540 0%, #0a1220 46%, #04070d 78%),
      #04070d;
    font-family: "Space Grotesk", "Segoe UI", sans-serif;
  }
  /* faint abyssal haze, upper corners */
  #card::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(520px 300px at 12% -8%, rgba(79,216,196,.045), transparent 70%),
      radial-gradient(560px 320px at 92% 4%, rgba(167,139,250,.05), transparent 70%);
  }
  #pool-svg { position: absolute; inset: 0; display: block; }
  #text {
    position: absolute;
    left: 0; right: 0; top: 96px;
    text-align: center;
  }
  #mark {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: 92px;
    line-height: 1;
    letter-spacing: .32em;
    text-indent: .32em;      /* optical centering of tracked caps */
    text-transform: uppercase;
    color: #cfe8e4;
    text-shadow: 0 0 60px rgba(79,216,196,.35), 0 0 18px rgba(79,216,196,.18);
  }
  #tagline {
    margin-top: 26px;
    font-weight: 300;
    font-size: 25px;
    letter-spacing: .34em;
    text-indent: .34em;
    text-transform: lowercase;
    color: #7f9c9b;
  }
  #agents {
    position: absolute;
    left: 0; right: 0;
    bottom: 44px;
    text-align: center;
    font-weight: 400;
    font-size: 19px;
    letter-spacing: .26em;
    text-indent: .26em;
    text-transform: lowercase;
    color: #a78bfa;
    opacity: .88;
    text-shadow: 0 0 24px rgba(167,139,250,.45);
  }
</style>
</head>
<body>
<div id="card">

  <!-- the pool: a luminous ellipse of water, low in the frame -->
  <svg id="pool-svg" viewBox="0 0 1200 630" width="1200" height="630" aria-hidden="true">
    <defs>
      <radialGradient id="water" cx="50%" cy="42%" r="75%">
        <stop offset="0%"  stop-color="hsl(200,55%,14%)"/>
        <stop offset="55%" stop-color="hsl(208,60%,9%)"/>
        <stop offset="100%" stop-color="hsl(216,65%,5%)"/>
      </radialGradient>
      <radialGradient id="heart" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(79,216,196,.30)"/>
        <stop offset="55%"  stop-color="rgba(79,216,196,.08)"/>
        <stop offset="100%" stop-color="rgba(79,216,196,0)"/>
      </radialGradient>
      <radialGradient id="violet-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(167,139,250,.55)"/>
        <stop offset="100%" stop-color="rgba(167,139,250,0)"/>
      </radialGradient>
      <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(79,216,196,.6)"/>
        <stop offset="100%" stop-color="rgba(79,216,196,0)"/>
      </radialGradient>
      <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="14"/>
      </filter>
    </defs>

    <!-- rim halo where water meets stone -->
    <ellipse cx="600" cy="472" rx="470" ry="128" fill="none"
             stroke="rgba(79,216,196,.34)" stroke-width="5" filter="url(#softer)"/>

    <!-- the water body -->
    <ellipse cx="600" cy="472" rx="462" ry="122" fill="url(#water)"/>
    <ellipse cx="600" cy="472" rx="462" ry="122" fill="none"
             stroke="rgba(120,200,190,.55)" stroke-width="1.6"/>

    <!-- inner luminance — something is alive down there -->
    <ellipse cx="600" cy="480" rx="340" ry="86" fill="url(#heart)"/>

    <!-- surface shimmer lines -->
    <g stroke="rgba(160,220,215,.16)" stroke-width="1.2" fill="none">
      <path d="M 260 448 q 60 -7 120 0 t 120 0 t 120 0 t 120 0 t 120 0"/>
      <path d="M 320 470 q 55 6 110 0 t 110 0 t 110 0 t 110 0 t 110 0" opacity=".7"/>
      <path d="M 390 494 q 50 -5 100 0 t 100 0 t 100 0 t 100 0" opacity=".5"/>
    </g>

    <!-- a few glowing plants rooted in the pool -->
    <g stroke-linecap="round" fill="none">
      <path d="M 452 505 q -6 -26 4 -46" stroke="rgba(79,216,196,.5)" stroke-width="2.4"/>
      <circle cx="457" cy="457" r="16" fill="url(#cyan-glow)"/>
      <circle cx="457" cy="457" r="4" fill="rgba(200,250,240,.95)"/>

      <path d="M 764 512 q 8 -30 -2 -52" stroke="rgba(251,123,181,.42)" stroke-width="2.2"/>
      <circle cx="762" cy="458" r="14" fill="rgba(251,123,181,.28)" filter="url(#soft)"/>
      <circle cx="762" cy="458" r="3.4" fill="rgba(255,205,225,.95)"/>

      <path d="M 596 522 q -4 -20 3 -34" stroke="rgba(120,220,180,.4)" stroke-width="2"/>
      <circle cx="599" cy="486" r="3" fill="rgba(190,245,225,.9)"/>
    </g>

    <!-- two drifters: a visitor (cyan) and a keeper (violet) -->
    <circle cx="530" cy="486" r="34" fill="url(#cyan-glow)" opacity=".8"/>
    <ellipse cx="530" cy="486" rx="8.5" ry="7" fill="rgba(170,240,228,.95)"/>
    <circle cx="530" cy="484" r="2.6" fill="rgba(235,255,250,.95)"/>

    <circle cx="676" cy="470" r="30" fill="url(#violet-glow)" opacity=".85"/>
    <polygon points="676,462.5 682.5,466.2 682.5,473.8 676,477.5 669.5,473.8 669.5,466.2"
             fill="rgba(216,196,255,.95)"/>
    <circle cx="676" cy="470" r="13" fill="none" stroke="rgba(167,139,250,.45)" stroke-width="1"/>

    <!-- plankton scatter, in and just above the water -->
    <g fill="rgba(79,216,196,.75)">
      <circle cx="352" cy="482" r="2.1"/>
      <circle cx="410" cy="500" r="1.5" opacity=".6"/>
      <circle cx="496" cy="512" r="1.8" opacity=".7"/>
      <circle cx="558" cy="452" r="1.4" opacity=".55"/>
      <circle cx="640" cy="508" r="2" opacity=".8"/>
      <circle cx="700" cy="497" r="1.4" opacity=".55"/>
      <circle cx="812" cy="486" r="2.2"/>
      <circle cx="872" cy="466" r="1.5" opacity=".6"/>
      <circle cx="922" cy="482" r="1.2" opacity=".5"/>
      <circle cx="300" cy="460" r="1.4" opacity=".5"/>
      <circle cx="620" cy="432" r="1.3" opacity=".65"/>
      <circle cx="536" cy="428" r="1" opacity=".45"/>
      <circle cx="736" cy="440" r="1.2" opacity=".5"/>
    </g>
    <!-- a few violet ones, drifting among them -->
    <g fill="rgba(167,139,250,.7)">
      <circle cx="386" cy="452" r="1.6"/>
      <circle cx="586" cy="500" r="1.3" opacity=".7"/>
      <circle cx="846" cy="502" r="1.7"/>
      <circle cx="668" cy="428" r="1.1" opacity=".6"/>
    </g>
    <!-- motes rising off the surface -->
    <g fill="rgba(150,225,215,.4)">
      <circle cx="470" cy="400" r="1.3"/>
      <circle cx="604" cy="378" r="1.1"/>
      <circle cx="722" cy="396" r="1.4"/>
      <circle cx="548" cy="360" r=".9"/>
      <circle cx="662" cy="352" r=".8"/>
    </g>

    <!-- rim stones, barely lit -->
    <g fill="hsl(210,18%,9%)">
      <ellipse cx="142" cy="466" rx="46" ry="20" transform="rotate(-9 142 466)"/>
      <ellipse cx="216" cy="530" rx="38" ry="16" transform="rotate(6 216 530)"/>
      <ellipse cx="1056" cy="472" rx="50" ry="21" transform="rotate(8 1056 472)"/>
      <ellipse cx="986" cy="540" rx="36" ry="15" transform="rotate(-7 986 540)"/>
      <ellipse cx="600" cy="608" rx="60" ry="18"/>
    </g>
  </svg>

  <div id="text">
    <div id="mark">Undertow</div>
    <div id="tagline">one pool, kept by the tide</div>
  </div>

  <div id="agents">not everyone here is human</div>

</div>
</body>
</html>
